max_events_per_sequence: 100
embedding_dim: 16
backbone:
  dim: 256
  event_aggregator:
    type: concat_linear
    params: {}
  context_aggregator:
    type: tokenizer
    params:
      num_tokens: 4
  history_aggregator:
    layer_order:
    - sequence_encoder
    - interaction
    - nonsequence_encoder
    sequence_encoder:
      type: modern_bert
      params:
        num_heads: 2
        dropout: 0.0
        rope: true
      finalize_in_stream: true
    nonsequence_encoder:
      type: stack
      params:
        blocks:
        - type: token_mixing
          params:
            kernel: permutation
        - type: per_token_ffn
          params:
            expansion_factor: 2
            activation: gelu
        queries:
          type: persistent
          params:
            num_tokens: 2
    interaction:
      schedule: layered
      type: cross_attention
      params:
        reader: queries
        num_tokens: 2
        projection: per_query_kv
        num_heads: 2
        write: add
      pool: mean
      independent_layers: true
    num_layers: 3
  readout_token: false
training:
  num_epochs: 1
  seed: 42
  event_store_backend: cached
  tracker:
    type: logging
  log_every_n_train_steps: 100
  dataloader:
    batch_size: 2048
    num_workers: 4
    pin_memory: true
    shuffle: true
  test_dataloader:
    batch_size: 2048
    num_workers: 4
    pin_memory: true
  accumulation: 16
  initialization:
    linear:
      kind: xavier_normal
    embedding:
      kind: normal
      std: 0.0001
    bias: zeros
  gradient_clipping:
    scope: dense
    max_norm: 10.0
  mixed_precision: bf16
  optimizers:
    default:
      type: adamw
      params:
        lr: 0.0001
        weight_decay: 0.0
    embeddings:
      type: adagrad
      params:
        lr: 0.05
prepare:
  allow_empty_sequences: true
