max_events_per_sequence: 100
embedding_dim: 16
backbone:
  dim: 256
  event_aggregator:
    type: sum
    params: {}
  context_aggregator:
    type: identity
    params: {}
  history_aggregator:
    sequence_encoder:
      type: identity
      params: {}
    nonsequence_encoder:
      type: stack
      params:
        num_layers: 3
        blocks:
        - type: token_mixing
          params:
            kernel: low_rank
            num_mix_heads: 2
            low_rank_dim: 16
        - type: per_token_ffn
          params:
            expansion_factor: 4
            activation: gelu
    interaction:
      schedule: once
      type: window_attention
      params:
        recent_length: 20
        num_dynamic_queries: 2
        num_learned_queries: 2
        attention_heads: 2
        context_source: raw
      pool: mean
  readout_token: false
training:
  num_epochs: 1
  seed: 42
  event_store_backend: cached
  tracker:
    type: logging
  log_every_n_train_steps: 100
  dataloader:
    batch_size: 2048
    num_workers: 4
    pin_memory: true
    shuffle: true
  test_dataloader:
    batch_size: 2048
    num_workers: 4
    pin_memory: true
  accumulation: 16
  initialization:
    linear:
      kind: xavier_normal
    embedding:
      kind: normal
      std: 0.0001
    bias: zeros
  gradient_clipping:
    scope: dense
    max_norm: 10.0
  mixed_precision: bf16
  optimizers:
    default:
      type: adamw
      params:
        lr: 0.0001
        weight_decay: 0.0
    embeddings:
      type: adagrad
      params:
        lr: 0.05
prepare:
  allow_empty_sequences: true
