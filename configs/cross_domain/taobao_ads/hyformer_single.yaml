  campaign_id:
    type: id
    preprocessor:
      min_count: 1
  price_bucket:
    type: id
    preprocessor:
      min_count: 1
  pid:
    type: id
    preprocessor:
      min_count: 1
features:
  item:
    encoder: item
    located_in:
      context: true
      event: true
  brand:
    encoder: brand
    located_in:
      context: true
      event: true
  category:
    encoder: category
    located_in:
      context: true
      event: true
  user_id:
    encoder: user_id
    located_in:
      context: true
      event: false
  cms_segid:
    encoder: cms_segid
    located_in:
      context: true
      event: false
  cms_group_id:
    encoder: cms_group_id
    located_in:
      context: true
      event: false
  final_gender_code:
    encoder: final_gender_code
    located_in:
      context: true
      event: false
  age_level:
    encoder: age_level
    located_in:
      context: true
