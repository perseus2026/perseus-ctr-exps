    preprocessor:
      min_count: 1
  brand:
    type: id
    preprocessor:
      min_count: 1
  category:
    type: id
    preprocessor:
      min_count: 1
  user_id:
    type: id
    preprocessor:
      min_count: 1
  cms_segid:
    type: id
    preprocessor:
