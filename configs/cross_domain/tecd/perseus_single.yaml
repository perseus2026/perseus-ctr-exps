task:
  type: classification
  metrics:
    roc_auc:
      type: roc_auc
      params:
        pos_label: '1'
    logloss:
      type: logloss
  preprocessor: {}
  layer:
    hidden:
    - 128
    - 64
  criterion:
    task_reduction: sum
  head: {}
events:
  retail-added_to_cart:
    attributes:
      item: null
      brand: null
  retail-click:
    attributes:
      item: null
      brand: null
  retail-order:
    attributes:
      item: null
      brand: null
  retail-view:
    attributes:
      item: null
      brand: null
encoders:
  item:
    type: id
    preprocessor:
      min_count: 1
  brand:
    type: id
    preprocessor:
      min_count: 1
  user_id:
    type: id
    preprocessor:
      min_count: 1
  region:
    type: id
    preprocessor:
      min_count: 1
  socdem_cluster:
    type: id
    preprocessor:
      min_count: 1
features:
  item:
    encoder: item
    located_in:
      context: true
      event: true
  brand:
    encoder: brand
    located_in:
      context: true
      event: true
  user_id:
    encoder: user_id
    located_in:
      context: true
      event: false
  region:
    encoder: region
    located_in:
      context: true
      event: false
  socdem_cluster:
    encoder: socdem_cluster
    located_in:
      context: true
      event: false
max_events_per_sequence: 512
embedding_dim: 16
backbone:
  dim: 256
  event_aggregator:
    type: weighted_sum
    params: {}
  context_aggregator:
    type: identity
    params: {}
  readout_token: true
  mask_context_from_history: false
  history_aggregator:
    sequence_encoder:
      type: modern_bert
      params:
        num_layers: 4
        num_heads: 4
        dropout: 0.1
        rope: true
    interaction:
      type: identity
      schedule: all_as_sequence
training:
  num_epochs: 1
  seed: 42
  event_store_backend: cached
  tracker:
    type: logging
  log_every_n_train_steps: 100
  dataloader:
    batch_size: 1024
    num_workers: 0
    pin_memory: true
    shuffle: true
  test_dataloader:
    batch_size: 1024
    num_workers: 0
    pin_memory: true
  accumulation: 32
  initialization:
    linear:
      kind: xavier_normal
    embedding:
      kind: normal
      std: 0.0001
    bias: zeros
  gradient_clipping:
    scope: dense
    max_norm: 10.0
  mixed_precision: bf16
  optimizers:
    default:
      type: adamw
      params:
        lr: 0.0001
        weight_decay: 0.0
    embeddings:
      type: adagrad
      params:
        lr: 0.05
prepare:
  allow_empty_sequences: true
max_duration_per_sequence: null
