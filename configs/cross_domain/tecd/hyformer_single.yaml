task:
  type: classification
  metrics:
    roc_auc:
      type: roc_auc
      params:
        pos_label: '1'
    logloss:
      type: logloss
  preprocessor: {}
  layer:
    hidden:
    - 128
    - 64
  criterion:
    task_reduction: sum
  head: {}
events:
  retail-added_to_cart:
    attributes:
      item: null
      brand: null
  retail-click:
    attributes:
      item: null
      brand: null
  retail-order:
    attributes:
      item: null
      brand: null
  retail-view:
    attributes:
      item: null
      brand: null
encoders:
  item:
    type: id
    preprocessor:
      min_count: 1
  brand:
    type: id
    preprocessor:
      min_count: 1
  user_id:
    type: id
    preprocessor:
      min_count: 1
  region:
    type: id
    preprocessor:
      min_count: 1
  socdem_cluster:
    type: id
    preprocessor:
      min_count: 1
features:
  item:
    encoder: item
    located_in:
      context: true
      event: true
  brand:
    encoder: brand
    located_in:
      context: true
      event: true
  user_id:
    encoder: user_id
    located_in:
      context: true
      event: false
  region:
    encoder: region
    located_in:
      context: true
      event: false
  socdem_cluster:
    encoder: socdem_cluster
    located_in:
      context: true
      event: false
max_events_per_sequence: 512
embedding_dim: 16
backbone:
  dim: 256
  event_aggregator:
    type: concat_linear
    params: {}
  context_aggregator:
    type: tokenizer
    params:
      num_tokens: 4
  history_aggregator:
    layer_order:
    - sequence_encoder
    - interaction
    - nonsequence_encoder
    sequence_encoder:
      type: self_attention
      params:
        num_heads: 2
        ffn:
          expansion_factor: 2
          activation: relu
          norm: none
        zero_padding: true
        mask_padding: false
    nonsequence_encoder:
      type: stack
      params:
        blocks:
        - type: token_mixing
          params:
            kernel: permutation
        - type: per_token_ffn
          params:
            expansion_factor: 2
            activation: gelu
        queries:
          type: persistent
          params:
            num_tokens: 2
    interaction:
      schedule: layered
      type: cross_attention
      params:
        reader: queries
        num_tokens: 2
        projection: shared
        num_heads: 2
        write: replace
        padding: zero
      pool: mean
      independent_layers: true
    num_layers: 3
  readout_token: false
training:
  num_epochs: 1
  seed: 42
  event_store_backend: cached
  tracker:
    type: logging
  log_every_n_train_steps: 100
  dataloader:
    batch_size: 1024
    num_workers: 0
    pin_memory: true
    shuffle: true
  test_dataloader:
    batch_size: 1024
    num_workers: 0
    pin_memory: true
  accumulation: 32
  initialization:
    linear:
      kind: xavier_normal
    embedding:
      kind: normal
      std: 0.0001
    bias: zeros
  gradient_clipping:
    scope: dense
    max_norm: 10.0
  mixed_precision: bf16
  optimizers:
    default:
      type: adamw
      params:
        lr: 0.0001
        weight_decay: 0.0
    embeddings:
      type: adagrad
      params:
        lr: 0.05
prepare:
  allow_empty_sequences: true
max_duration_per_sequence: null
